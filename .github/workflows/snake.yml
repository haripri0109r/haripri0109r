name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake files
        uses: Platane/snk@v3
        with:
          github_user_name: haripri0109r
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#C1121F&color_dots=#F5F5F5,#D0D0D0,#9B111E,#C1121F,#0D0D0D
            dist/github-contribution-grid-snake-dark.svg?color_snake=#C1121F&color_dots=#0D0D0D,#262626,#9B111E,#C1121F,#F5F5F5
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
