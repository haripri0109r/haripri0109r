<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0D0D" />
      <stop offset="45%" stop-color="#1A1A1A" />
      <stop offset="76%" stop-color="#2A1215" />
      <stop offset="100%" stop-color="#0D0D0D" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="240" y1="130" x2="1020" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F5F5" />
      <stop offset="0.45" stop-color="#D0D0D0" />
      <stop offset="1" stop-color="#C1121F" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="240" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1A1A" stop-opacity="0.98" />
      <stop offset="1" stop-color="#2B0D10" stop-opacity="0.98" />
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 110) scale(340 220)">
      <stop stop-color="#C1121F" stop-opacity="0.42" />
      <stop offset="1" stop-color="#C1121F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1250 360) scale(420 240)">
      <stop stop-color="#D0D0D0" stop-opacity="0.34" />
      <stop offset="1" stop-color="#D0D0D0" stop-opacity="0" />
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#surface)" />
  <ellipse cx="280" cy="110" rx="340" ry="220" fill="url(#glow1)">
    <animate attributeName="cx" values="280;350;280" dur="10s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="1250" cy="360" rx="420" ry="240" fill="url(#glow2)">
    <animate attributeName="cy" values="360;310;360" dur="11s" repeatCount="indefinite" />
  </ellipse>

  <g stroke="#D0D0D0" stroke-opacity="0.16">
    <path d="M0 420C240 360 480 470 700 420C970 360 1260 420 1600 360" fill="none"/>
    <path d="M0 350C220 280 500 370 780 320C1050 270 1320 310 1600 240" fill="none"/>
  </g>

  <g filter="url(#neon)">
    <text x="130" y="210" fill="url(#titleGrad)" font-size="78" font-weight="800" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">
      HARIPRIYAN
    </text>
    <text x="132" y="258" fill="#F5F5F5" font-size="26" font-weight="500" font-family="Segoe UI, Arial, sans-serif" opacity="0.92">
      Full-Stack Engineer | Open Source Builder | UI Systems Architect
    </text>
  </g>

  <g transform="translate(132 298)">
    <rect width="240" height="52" rx="14" fill="url(#chipGrad)" stroke="#C1121F" stroke-opacity="0.48" />
    <circle cx="31" cy="26" r="8" fill="#C1121F" />
    <text x="50" y="32" fill="#F5F5F5" font-size="18" font-family="Segoe UI, Arial, sans-serif">Spring Boot</text>
  </g>
  <g transform="translate(390 298)">
    <rect width="180" height="52" rx="14" fill="url(#chipGrad)" stroke="#D0D0D0" stroke-opacity="0.48" />
    <circle cx="31" cy="26" r="8" fill="#F5F5F5" />
    <text x="50" y="32" fill="#F5F5F5" font-size="18" font-family="Segoe UI, Arial, sans-serif">React</text>
  </g>
  <g transform="translate(586 298)">
    <rect width="188" height="52" rx="14" fill="url(#chipGrad)" stroke="#9B111E" stroke-opacity="0.48" />
    <circle cx="31" cy="26" r="8" fill="#9B111E" />
    <text x="50" y="32" fill="#F5F5F5" font-size="18" font-family="Segoe UI, Arial, sans-serif">MySQL</text>
  </g>
  <g transform="translate(792 298)">
    <rect width="206" height="52" rx="14" fill="url(#chipGrad)" stroke="#D0D0D0" stroke-opacity="0.48" />
    <circle cx="31" cy="26" r="8" fill="#D0D0D0" />
    <text x="50" y="32" fill="#F5F5F5" font-size="18" font-family="Segoe UI, Arial, sans-serif">MongoDB</text>
  </g>

  <g transform="translate(132 364)">
    <rect width="222" height="52" rx="14" fill="url(#chipGrad)" stroke="#C1121F" stroke-opacity="0.48" />
    <circle cx="31" cy="26" r="8" fill="#C1121F" />
    <text x="50" y="32" fill="#F5F5F5" font-size="18" font-family="Segoe UI, Arial, sans-serif">Agentic AI</text>
  </g>
  <g transform="translate(372 364)">
    <rect width="194" height="52" rx="14" fill="url(#chipGrad)" stroke="#D0D0D0" stroke-opacity="0.48" />
    <circle cx="31" cy="26" r="8" fill="#F5F5F5" />
    <text x="50" y="32" fill="#F5F5F5" font-size="18" font-family="Segoe UI, Arial, sans-serif">Node.js</text>
  </g>
  <g transform="translate(584 364)">
    <rect width="194" height="52" rx="14" fill="url(#chipGrad)" stroke="#9B111E" stroke-opacity="0.48" />
    <circle cx="31" cy="26" r="8" fill="#9B111E" />
    <text x="50" y="32" fill="#F5F5F5" font-size="18" font-family="Segoe UI, Arial, sans-serif">Express</text>
  </g>
  <g transform="translate(796 364)">
    <rect width="218" height="52" rx="14" fill="url(#chipGrad)" stroke="#D0D0D0" stroke-opacity="0.48" />
    <circle cx="31" cy="26" r="8" fill="#D0D0D0" />
    <text x="50" y="32" fill="#F5F5F5" font-size="18" font-family="Segoe UI, Arial, sans-serif">JavaScript</text>
  </g>

  <g fill="#CCDBFF" font-size="14" font-family="Consolas, monospace" opacity="0.84">
    <text x="1232" y="64">SYSTEM ONLINE</text>
    <text x="1232" y="84">MODE: CREATIVE BUILD</text>
    <text x="1232" y="104">SYNC: OPEN SOURCE</text>
  </g>

  <g>
    <circle cx="1160" cy="170" r="3" fill="#C1121F">
      <animate attributeName="cy" values="170;150;170" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1290" cy="220" r="2.8" fill="#F5F5F5">
      <animate attributeName="cy" values="220;200;220" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1410" cy="140" r="2.5" fill="#D0D0D0">
      <animate attributeName="cy" values="140;170;140" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1510" cy="220" r="2.6" fill="#9B111E">
      <animate attributeName="cy" values="220;190;220" dur="4.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="4.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="248" r="2.2" fill="#AAAAAA">
      <animate attributeName="cy" values="248;222;248" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="5.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1450" cy="300" r="2.7" fill="#C1121F">
      <animate attributeName="cy" values="300;270;300" dur="6.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.95;0.1" dur="6.3s" repeatCount="indefinite" />
    </circle>
  </g>

  <rect x="124" y="120" width="7" height="235" rx="3.5" fill="#C1121F" filter="url(#soft)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite" />
  </rect>
</svg>
